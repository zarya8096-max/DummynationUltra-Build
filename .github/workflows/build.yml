name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/DummynationUltra-debug.apk \;
          cd output
          sha256sum DummynationUltra-debug.apk > SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DummynationUltra-APK
          path: output/
          retention-days: 14

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.0-build-${{ github.run_number }}" \
            output/DummynationUltra-debug.apk \
            output/SHA256SUMS.txt \
            --title "Dummynation Ultra v2.0.0 (Build ${{ github.run_number }})" \
            --notes "Automated CI Android Build for Dummynation Ultra Mobile."
